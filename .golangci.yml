run:
  timeout: 5m
linters:
  enable:
    - govet
    - errcheck
    - gofmt
    - staticcheck
issues:
  exclude:
    - "helpers/tests.go.*Error return value of .* is not checked"
    - "apis/utils_test.go.*Error return value of .* is not checked"
  exclude-rules:
    - linters:
        - gofmt
      text: "imports are not sorted"
linters-settings:
  errcheck:
    # Leave empty or customize further settings for errcheck if needed
