run:
  timeout: 5m
linters:
  enable:
    - govet
    - errcheck
    - gofmt
    - staticcheck
issues:
  exclude:
    - path: "helpers/tests.go"
      text: "Error return value of .* is not checked"
    - path: "apis/utils_test.go"
      text: "Error return value of .* is not checked"
  exclude-rules:
    - linters:
        - gofmt
      text: "imports are not sorted"
linters-settings:
  errcheck:
    # Additional settings for errcheck can be added here if necessary
